<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de productos</title>
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- Conectamos el diseño -->
    <link rel="stylesheet" href="estilos.css">

    <!-- Ejecutamos JavaScript después de cargar el HTML -->
    <script type="module" src="./js/app.js"></script>
</head>
<body>
    <main>
        <h1>Registro de productos</h1>
        <p>Completa los datos del producto.</p>
       <img src="/img/logo.png" alt="">

        <form id="formulario" novalidate>
            <label for="nombre">Nombre del producto</label>
            <input
                type="text"
                id="nombre"
                placeholder="Ejemplo: Cuaderno"
                aria-describedby="error-nombre"
            >
            <small id="error-nombre" class="error"></small>

            <label for="precio">Precio (Bs)</label>
            <input
                type="number"
                id="precio"
                min="0.01"
                step="0.01"
                placeholder="Ejemplo: 15.50"
                aria-describedby="error-precio"
            >
            <small id="error-precio" class="error"></small>

            <label for="cantidad">Cantidad</label>
            <input
                type="number"
                id="cantidad"
                min="0"
                step="1"
                placeholder="Ejemplo: 2"
                aria-describedby="error-cantidad"
            >
            <small id="error-cantidad" class="error"></small>

            <div class="botones">
                <button type="submit">Registrar</button>
                <button type="button" id="limpiar">Limpiar</button>
            </div>
        </form>

        <p id="mensaje" role="status"></p>

        <h2>Productos registrados</h2>
        <ul id="lista"></ul>
        <!-- Diseño de cada producto: conserva los atributos data-*. -->
        <template id="plantilla-producto">
            <li class="producto">
                <span>
                    <strong data-nombre></strong>
                    | Precio: Bs <span data-precio></span>
                    | Cantidad: <span data-cantidad></span>
                    | Total: Bs <span data-total></span>
                </span>
                <button type="button" class="boton-eliminar" data-eliminar>Eliminar</button>
            </li>
        </template>

        <dialog id="confirmar-eliminar" class="confirmacion"
                aria-labelledby="titulo-eliminar" aria-describedby="detalle-eliminar">
            <h2 id="titulo-eliminar">¿Estás seguro de eliminar este producto?</h2>
            <p id="detalle-eliminar"></p>
            <form method="dialog" class="botones">
                <button value="cancelar" autofocus>Cancelar</button>
                <button value="eliminar" class="boton-eliminar">Sí, eliminar</button>
            </form>
        </dialog>

        <p class="ayuda">
            
        </p>
    </main>
</body>
</html>
