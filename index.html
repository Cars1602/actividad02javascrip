<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de productos</title>

    <!-- Conectamos el diseño -->
    <link rel="stylesheet" href="estilos.css">

    <!-- Ejecutamos JavaScript después de cargar el HTML -->
    <script type="module" src="./js/app.js"></script>
</head>
<body>
    <main>
        <h1>Registro de productos</h1>
        <p>Completa los datos del producto.</p>

        <form id="formulario" novalidate>
            <label for="nombre">Nombre del producto</label>
            <input
                type="text"
                id="nombre"
                placeholder="Ejemplo: Cuaderno"
                aria-describedby="error-nombre"
            >
            <small id="error-nombre" class="error"></small>

            <label for="precio">Precio (Bs)</label>
            <input
                type="number"
                id="precio"
                min="0.01"
                step="0.01"
                placeholder="Ejemplo: 15.50"
                aria-describedby="error-precio"
            >
            <small id="error-precio" class="error"></small>

            <label for="cantidad">Cantidad</label>
            <input
                type="number"
                id="cantidad"
                min="0"
                step="1"
                placeholder="Ejemplo: 2"
                aria-describedby="error-cantidad"
            >
            <small id="error-cantidad" class="error"></small>

            <div class="botones">
                <button type="submit">Registrar</button>
                <button type="button" id="limpiar">Limpiar</button>
            </div>
        </form>

        <p id="mensaje" role="status"></p>

        <h2>Productos registrados</h2>
        <ul id="lista"></ul>

        <p class="ayuda">
            Enter: registrar · Escape: limpiar.
            Los productos se guardan en la base de datos Neon.
            ing Moscoso
        </p>
    </main>
</body>
</html>
